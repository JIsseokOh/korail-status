<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기차표 현황</title>
<meta name="description" content="확보한 기차표와 더 좋은 표를 찾는 진행 상황">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f5fa; --card: #ffffff; --text: #1b2230; --muted: #6b7686; --line: #e4e8ef;
    --accent: #3b5bdb; --accent-soft: #e8edfb; --ok: #1f9d55; --ok-soft: #e3f6ea; --warn: #b7791f; --warn-soft: #fdf3dc;
    --bad: #c53030; --bad-soft: #fde8e8; --shadow: 0 6px 24px rgba(24, 39, 75, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1420; --card: #171d2b; --text: #e9edf5; --muted: #98a3b6; --line: #27304200; --line: #273042;
      --accent: #8ea6ff; --accent-soft: #1f2a48; --ok: #5fd38a; --ok-soft: #173327; --warn: #f1c26b; --warn-soft: #3a2f16;
      --bad: #ff8a80; --bad-soft: #3b1f1f; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1420; --card: #171d2b; --text: #e9edf5; --muted: #98a3b6; --line: #273042;
    --accent: #8ea6ff; --accent-soft: #1f2a48; --ok: #5fd38a; --ok-soft: #173327; --warn: #f1c26b; --warn-soft: #3a2f16;
    --bad: #ff8a80; --bad-soft: #3b1f1f; --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 "Noto Sans KR", -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 56px; }
  header { margin-bottom: 18px; }
  header h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
  .status-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: var(--muted); font-size: 13.5px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: middle; animation: pulse 1.8s ease-in-out infinite; }
  .dot.off { background: var(--muted); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .alert { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 10px; letter-spacing: 0.04em; text-transform: uppercase; }
  .pill { display: inline-block; font-size: 12.5px; font-weight: 500; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.muted { background: var(--line); color: var(--muted); }
  .date { font-size: 20px; font-weight: 700; margin: 2px 0 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .chain { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .seg { flex: 1 1 230px; min-width: 0; display: flex; align-items: stretch; gap: 10px; }
  .stop { min-width: 72px; }
  .stop .time { font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
  .chain.multi .stop .time { font-size: 24px; }
  .stop .name { font-size: 15px; margin-top: 4px; }
  .stop .door { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .stop.arrive { text-align: right; margin-left: auto; }
  .rail { flex: 1; min-width: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 12.5px; padding-top: 10px; text-align: center; }
  .xfer { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 12px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 11.5px; line-height: 1.2; }
  .xfer strong { color: var(--text); font-size: 13.5px; margin-top: 2px; }
  .rail .line { width: 100%; height: 2px; background: var(--line); position: relative; margin: 6px 0; }
  .rail .line::before, .rail .line::after { content: ""; position: absolute; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .rail .line::before { left: 0; } .rail .line::after { right: 0; }
  .rail .train { font-weight: 500; color: var(--text); white-space: nowrap; }
  .seat { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .seat .muted { color: var(--muted); }
  .note { margin-top: 12px; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .note strong { color: var(--text); font-weight: 500; }
  .empty { color: var(--muted); font-size: 14px; }
  .cand-card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 10px; margin-top: 10px; }
  .cand-card.held { border-color: var(--accent); background: var(--accent-soft); }
  .cand-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 6px; }
  .cand-head .rank { font-weight: 700; color: var(--accent); font-size: 14px; }
  .cand-head .cand-total { font-weight: 700; font-size: 17px; }
  .cand-head .pill { margin-left: auto; align-self: center; }
  .cand-card .stop .time { font-size: 22px; }
  .cand-card .chain.multi .stop .time { font-size: 19px; }
  .cand-card .seg { flex-basis: 200px; }
  .cand-card .stop { min-width: 64px; }
  .cand-card .rail { font-size: 12px; padding-top: 6px; }
  .cand-card .xfer { padding: 4px 9px; }
  .cand-sub { color: var(--muted); font-size: 12.5px; }
  details > summary { cursor: pointer; color: var(--accent); font-size: 14px; list-style: none; padding: 8px 0 2px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::before { content: "▸ "; }
  details[open] > summary::before { content: "▾ "; }
  ul.timeline { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
  ul.timeline li { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  ul.timeline li:first-child { border-top: none; }
  ul.timeline .when { color: var(--muted); white-space: nowrap; min-width: 86px; }
  .past { font-size: 13.5px; color: var(--muted); }
  .past li { padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; flex-wrap: wrap; }
  .past ul { list-style: none; margin: 0; padding: 0; }
  footer { color: var(--muted); font-size: 12.5px; margin-top: 22px; line-height: 1.6; }
  @media (max-width: 480px) {
    main { padding: 18px 12px 48px; }
    .card { padding: 16px 14px 14px; border-radius: 16px; }
    .stop .time { font-size: 26px; }
    .stop { min-width: 80px; }
    .cand-card .stop .time { font-size: 20px; }
    .cand-head .pill { margin-left: 0; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>기차표 현황</h1>
    <div class="status-line" id="status-line"><span class="dot off"></span>불러오는 중…</div>
  </header>
  <div id="alert"></div>
  <div id="content"></div>
</main>
<script>
(function () {
  "use strict";
  var API_URL = "https://api.github.com/repos/JIsseokOh/korail-status/contents/status.json?ref=data";
  var DATA_URL = "https://raw.githubusercontent.com/JIsseokOh/korail-status/data/status.json";
  var DAYS = ["일", "월", "화", "수", "목", "금", "토"];

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }
  function minutes(m) { if (m == null) return "?"; m = Math.round(m); var h = Math.floor(m / 60), r = m % 60; return h && r ? h + "시간 " + r + "분" : h ? h + "시간" : r + "분"; }
  function longDate(d) {
    if (!d || d.length < 8) return d || "";
    var y = +d.slice(0, 4), m = +d.slice(4, 6), day = +d.slice(6, 8);
    return m + "월 " + day + "일 (" + DAYS[new Date(y, m - 1, day).getDay()] + ")";
  }
  function hm(iso) { return iso ? iso.slice(11, 16) : ""; }
  function mdhm(iso) { return iso ? (+iso.slice(5, 7)) + "/" + (+iso.slice(8, 10)) + " " + iso.slice(11, 16) : ""; }
  function ago(iso) {
    if (!iso) return "";
    var diff = (Date.now() - new Date(iso).getTime()) / 60000;
    if (diff < 1) return "방금";
    if (diff < 60) return Math.round(diff) + "분 전";
    if (diff < 1440) return Math.round(diff / 60) + "시간 전";
    return Math.round(diff / 1440) + "일 전";
  }
  function addMinutes(hhmm, delta) {
    var parts = hhmm.split(":"); var t = (+parts[0]) * 60 + (+parts[1]) + delta;
    t = ((t % 1440) + 1440) % 1440;
    return ("0" + Math.floor(t / 60)).slice(-2) + ":" + ("0" + (t % 60)).slice(-2);
  }
  function won(v) { return (v || 0).toLocaleString("ko-KR") + "원"; }
  function legStatus(leg) {
    var h = leg.holding;
    if (h && h.paid) return leg.watching ? { text: "표 확보 · 더 좋은 표 찾는 중", cls: "ok" } : { text: "표 확정", cls: "ok" };
    if (h && h.is_waiting) return { text: "예약대기 등록", cls: "warn" };
    if (h) return { text: "예약됨 · 결제 필요", cls: "warn" };
    if (leg.watching || leg.status === "watching") return { text: "취소표 찾는 중", cls: "" };
    if (leg.status === "available") return { text: "좌석 있음", cls: "ok" };
    if (leg.status === "expired") return { text: "표를 못 구했어요", cls: "bad" };
    if (leg.status === "failed") return { text: "실패", cls: "bad" };
    if (leg.status === "stopped") return { text: "중지됨", cls: "muted" };
    return { text: leg.status || "", cls: "muted" };
  }

  function diffMin(a, b) {
    var p = a.split(":"), q = b.split(":");
    var d = ((+q[0]) * 60 + (+q[1])) - ((+p[0]) * 60 + (+p[1]));
    return d < 0 ? d + 1440 : d;
  }
  // 구간마다 작은 표 하나씩을 좌우로 이어 붙이고, 사이에 환승 대기 칩을 둡니다. 폭이 모자라면 다음 줄로 내려갑니다.
  function journeyHtml(it, options) {
    options = options || {};
    var legs = it.legs || [];
    if (!legs.length) return "";
    var parts = [];
    legs.forEach(function (l, i) {
      var depDoor = i === 0 && it.access_min && options.doors !== false ? '<div class="door">집에서 ' + it.access_min + "분 잡으면 " + esc(addMinutes(l.dep_time, -it.access_min)) + " 출발</div>" : "";
      var arrDoor = i === legs.length - 1 && it.egress_min && options.doors !== false ? '<div class="door">역에서 목적지까지 ' + it.egress_min + "분</div>" : "";
      if (i > 0) parts.push('<div class="xfer"><span>환승 대기</span><strong>' + diffMin(legs[i - 1].arr_time, l.dep_time) + "분</strong></div>");
      parts.push('<div class="seg">' +
        '<div class="stop"><div class="time">' + esc(l.dep_time) + '</div><div class="name">' + esc(l.dep) + "</div>" + depDoor + "</div>" +
        '<div class="rail"><div class="train">' + esc(l.train_type + " " + l.train_no) + '</div><div class="line"></div><div>' + minutes(diffMin(l.dep_time, l.arr_time)) + "</div></div>" +
        '<div class="stop arrive"><div class="time">' + esc(l.arr_time) + '</div><div class="name">' + esc(l.arr) + "</div>" + arrDoor + "</div>" +
        "</div>");
    });
    var html = '<div class="chain' + (legs.length > 1 ? " multi" : "") + '">' + parts.join("") + "</div>";
    if (options.total && (it.access_min || it.egress_min)) {
      html += '<div class="note">집에서 목적지까지 <strong>' + minutes(it.total_min) + "</strong> 예상 (역 이동시간 포함)</div>";
    }
    return html;
  }

  function holdingHtml(leg) {
    var h = leg.holding;
    if (!h) return "";
    var seats = [];
    (h.reservations || []).forEach(function (r) {
      (r.seats || []).forEach(function (s) {
        seats.push((legsCount(h) > 1 ? r.train.train_type + " " + r.train.train_no + " " : "") + (s.car ? s.car + "호차 " + s.seat : "예약대기") + " · " + s["class"]);
      });
    });
    if (!seats.length) (h.tickets || []).forEach(function (t) { seats.push((legsCount(h) > 1 ? t.train.train_type + " " + t.train.train_no + " " : "") + t.car + "호차 " + t.seat); });
    var pay = h.paid ? '<span class="pill ok">결제 완료</span>' : h.is_waiting ? '<span class="pill warn">예약대기</span>' : '<span class="pill warn">결제 필요' + (h.buy_limit ? " · " + esc(hm(h.buy_limit)) + "까지" : "") + "</span>";
    return journeyHtml(h, { total: true }) +
      '<div class="seat">' + pay + '<span>' + esc(seats.join(", ") || "좌석 정보 없음") + "</span><span>" + won(h.price) + '</span><span class="muted">예약번호 ' + esc(h.pnr) + "</span></div>";
  }
  function legsCount(it) { return (it.legs || []).length; }

  function candidateCard(c) {
    var pill = c.held ? '<span class="pill">지금 표</span>' : c.available ? '<span class="pill ok">좌석 있음</span>' : c.waiting ? '<span class="pill warn">예약대기 가능</span>' : '<span class="pill muted">매진</span>';
    var breakdown = (c.access_min || c.egress_min) ? '<span class="cand-sub">역까지 ' + c.access_min + "분 + 열차 " + minutes(c.duration_min) + " + 역에서 " + c.egress_min + "분</span>" : "";
    return '<div class="cand-card' + (c.held ? " held" : "") + '"><div class="cand-head"><span class="rank">' + c.rank + '순위</span><span class="cand-total">' + minutes(c.total_min != null ? c.total_min : c.duration_min) + "</span>" + breakdown + pill + "</div>" + journeyHtml(c, { doors: false }) + "</div>";
  }

  function candidatesHtml(leg) {
    var cands = leg.candidates || [];
    if (!cands.length) return "";
    var cards = cands.map(candidateCard);
    var heading = leg.holding ? "더 좋은 경로 후보" : "노리고 있는 경로";
    return '<div class="card"><h2>' + heading + "</h2>" +
      cards.slice(0, 5).join("") + (cards.length > 5 ? '<details><summary>더 보기 (' + (cards.length - 5) + "개)</summary>" + cards.slice(5).join("") + "</details>" : "") + "</div>";
  }

  function historyHtml(leg, job) {
    var items = (leg.history || []).slice(-5).reverse().map(function (x) {
      return '<li><span class="when">' + esc(mdhm(x.at)) + "</span><span>" + esc(x.note || x.action) + (x.fee != null ? " (수수료 " + won(x.fee) + ")" : "") + "</span></li>";
    });
    var next = job.status === "running" && job.next_check_at ? '<li><span class="when">다음 확인</span><span>' + esc(hm(job.next_check_at)) + " (지금까지 " + (job.checks || 0) + "번 확인)</span></li>" : "";
    if (!items.length && !next) return "";
    return '<div class="card"><h2>진행 기록</h2><ul class="timeline">' + next + items.join("") + "</ul></div>";
  }

  function legHtml(leg, job) {
    var st = legStatus(leg);
    var w = leg.window || {};
    var cond = [];
    if (w.after) cond.push("집에서 " + hm(w.after) + " 이후 출발");
    if (w.latest) cond.push(w.latest + "까지 출발");
    if (w.arrive_by) cond.push("목적지에 " + hm(w.arrive_by) + "까지 도착");
    if (leg.max_rank) cond.push("상위 " + leg.max_rank + "개 경로 안에서만 예매");
    var html = '<div class="card">' +
      '<h2>' + esc(leg.label === "편도" ? "여정" : leg.label) + "</h2>" +
      '<div class="date">' + esc(longDate(leg.date)) + ' <span class="pill ' + st.cls + '">' + esc(st.text) + "</span></div>";
    if (leg.holding) {
      html += holdingHtml(leg);
      if (leg.watching && leg.held_rank) { var better = leg.max_rank ? Math.min(leg.held_rank - 1, leg.max_rank) : leg.held_rank - 1; html += '<div class="note">지금 표는 <strong>' + leg.held_rank + "번째로 좋은 경로</strong>예요. 더 좋은 " + better + "개 경로에 취소표가 나오면 자동으로 바꾸고 알려 드려요.</div>"; }
    } else if (leg.watching || leg.status === "watching") {
      // 좌석이 없을 때의 안내 문구는 두지 않습니다 (후보 카드가 바로 이어집니다).
    } else if (leg.error) {
      html += '<div class="empty">' + esc(leg.error) + "</div>";
    }
    if (cond.length) html += '<div class="note">조건: ' + esc(cond.join(" · ")) + "</div>";
    if (leg.error && leg.holding) html += '<div class="note" style="color:var(--bad)">' + esc(leg.error) + "</div>";
    html += "</div>";
    if (leg.watching || !leg.holding) html += candidatesHtml(leg);
    html += historyHtml(leg, job);
    return html;
  }

  function ticketsHtml(tickets, data) {
    var seen = {};
    data.jobs.forEach(function (j) { (j.legs || []).forEach(function (l) { if (l.holding) seen[l.holding.pnr] = true; }); });
    var extra = (tickets || []).filter(function (t) { return !seen[t.pnr]; });
    if (!extra.length) return "";
    return '<div class="card"><h2>그 밖의 승차권</h2><ul class="timeline">' + extra.map(function (t) {
      return '<li><span class="when">' + esc(longDate(t.train.dep_date)) + "</span><span>" + esc(t.train.train_type + " " + t.train.train_no + " " + t.train.dep + " " + t.train.dep_time + " → " + t.train.arr + " " + t.train.arr_time + " · " + (t.car ? t.car + "호차 " + t.seat : "")) + " · " + won(t.price) + "</span></li>";
    }).join("") + "</ul></div>";
  }

  function pastHtml(jobs) {
    if (!jobs.length) return "";
    var ko = { done: "완료", partial: "일부 성공", failed: "실패", stopped: "중지됨", lost: "중단됨" };
    return '<div class="card past"><details><summary>지난 기록 (' + jobs.length + "건)</summary><ul>" + jobs.map(function (j) {
      var leg = (j.legs || [])[0] || {};
      var h = leg.holding;
      return "<li><span>" + esc(mdhm(j.finished_at || j.updated_at)) + "</span><span>" + esc(longDate(leg.date)) + " " + esc(leg.route || "") + "</span><span>" + esc(ko[j.status] || j.status) +
        (h ? " · " + esc(h.legs && h.legs[0] ? h.legs[0].train_type + " " + h.legs[0].train_no : "") + (h.paid ? " 결제" : "") : "") + "</span></li>";
    }).join("") + "</ul></details></div>";
  }

  function render(data) {
    var running = data.jobs.filter(function (j) { return j.status === "running" || j.status === "starting"; });
    var past = data.jobs.filter(function (j) { return j.status !== "running" && j.status !== "starting"; });
    var html = "";
    if (running.length) {
      running.forEach(function (j) { (j.legs || []).forEach(function (l) { html += legHtml(l, j); }); });
    } else {
      // 감시가 끝났어도 가장 최근에 확보한 표는 보여 줍니다.
      var recent = past.filter(function (j) { return (j.legs || []).some(function (l) { return l.holding; }); })[0];
      if (recent) (recent.legs || []).forEach(function (l) { if (l.holding) html += legHtml(l, recent); });
      else html += '<div class="card"><div class="empty">지금 진행 중인 예매가 없어요.</div></div>';
    }
    html += ticketsHtml(data.tickets, data) + pastHtml(past);
    document.getElementById("content").innerHTML = html;

    var staleMin = (Date.now() - new Date(data.generated_at).getTime()) / 60000;
    var live = running.length > 0 && staleMin < 40;
    document.getElementById("status-line").innerHTML = '<span class="dot ' + (live ? "" : "off") + '"></span>' +
      (running.length ? "취소표 감시 중" : "감시 없음");
    document.getElementById("alert").innerHTML = staleMin > 40 && running.length ? '<div class="alert">갱신이 ' + Math.round(staleMin) + "분째 없어요. 예매를 돌리는 컴퓨터가 꺼졌거나 인터넷이 끊겼을 수 있어요.</div>" : "";
  }

  function fetchJson(url, options) {
    return fetch(url, options).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  }
  function load() {
    fetchJson(API_URL, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" })
      .catch(function () { return fetchJson(DATA_URL + "?t=" + Date.now(), { cache: "no-store" }); })
      .then(render)
      .catch(function (e) { document.getElementById("status-line").innerHTML = '<span class="dot off"></span>데이터를 불러오지 못했어요 (' + esc(e.message) + ")"; });
  }
  load();
  setInterval(load, 90000);
})();
</script>
</body>
</html>
